<div class="p-6">
    <h1 class="text-2xl font-bold mb-6 text-gray-800">Sticker Gallery</h1>

    @if (stickers().length > 0) {
        <div
            class="grid gap-4 grid-cols-[repeat(auto-fill,minmax(150px,1fr))]"
        >
            @for (item of stickers(); track item.url) {
                <div
                    class="group flex flex-col rounded-xl bg-white shadow-sm ring-1 ring-gray-200 overflow-hidden transition hover:shadow-md hover:-translate-y-0.5"
                >
                    <!-- Ảnh -->
                    <div class="aspect-square bg-gray-50 overflow-hidden">
                        <img
                            [src]="item.url"
                            [alt]="item.name"
                            loading="lazy"
                            class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                        />
                    </div>

                    <!-- Tên -->
                    <p
                        class="px-2 pt-2 text-xs sm:text-sm font-medium text-gray-700 line-clamp-2 text-center"
                        [title]="item.name"
                    >
                        {{ item.name }}
                    </p>

                    <!-- Thanh nút -->
                    <div class="mt-auto flex gap-2 p-2">
                        <button
                            type="button"
                            (click)="download(item)"
                            class="flex-1 inline-flex items-center justify-center gap-1 rounded-md bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-medium px-2 py-1.5 transition"
                            title="Tải xuống"
                        >
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                class="w-3.5 h-3.5"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                                stroke-width="2"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M12 4v12m0 0l-4-4m4 4l4-4M4 20h16"
                                />
                            </svg>
                            Download
                        </button>
                    </div>
                </div>
            }
        </div>
    }
</div>
